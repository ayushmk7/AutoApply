# Phase 19 — local stack: Redis + API + worker (separate processes per PRD §10.1).
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ['node', 'dist/server.js']
    ports:
      - '3001:3001'
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    env_file:
      - ./backend/server/.env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ['node', 'dist/worker.js']
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    env_file:
      - ./backend/server/.env
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
