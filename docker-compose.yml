# Phase 19 — local stack: Redis + API + worker (separate processes per PRD §10.1).
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ['node', 'dist/server.js']
    ports:
      - '3001:3001'
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    env_file:
      - ./backend/server/.env
    depends_on:
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ['node', 'dist/worker.js']
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    env_file:
      - ./backend/server/.env
    depends_on:
      - redis
