openapi: 3.0.3
info:
  title: AutoApply API
  version: 1.0.0
  description: |
    Phase 20.1 — REST contract (Bearer `Authorization` for protected routes).
    Error shape: `{ "error": string, "code"?: string, "details"?: unknown }`.
servers:
  - url: /api
    description: Same-origin (or Vite proxy in development)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        details: {}
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      summary: Register / ensure user document
      security: [bearerAuth: []]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: OK
  /auth/skip:
    post:
      summary: Demo session token (rate-limited)
      security: []
      responses:
        '200':
          description: Demo JWT
  /jobs:
    get:
      summary: Job board
      parameters:
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200':
          description: Job rows
  /jobs/from-url:
    post:
      summary: Apply from pasted URL / JD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                job_description_text: { type: string }
                force_manual_submit: { type: boolean }
      responses:
        '202':
          description: Queued
  /jobs/from-url/{application_id}/status:
    get:
      summary: Apply-from-url application status snapshot
      parameters:
        - in: path
          name: application_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Status payload
  /feed:
    get:
      summary: Feed history
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Events page
  /applications:
    get:
      summary: List user applications
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: sort_by
          schema: { type: string, enum: [created_at, updated_at, fit_score] }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200':
          description: Applications page
  /applications/{id}:
    get:
      summary: Application detail plus listing
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Application detail
  /applications/{id}/resume:
    get:
      summary: Signed resume URL
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Signed URL payload
  /applications/{id}/cover-letter:
    get:
      summary: Signed cover-letter URL
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Signed URL payload
  /applications/{id}/screenshot:
    get:
      summary: Signed screenshot URL
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Signed URL payload
  /applications/{id}/retry:
    post:
      summary: Requeue retryable application
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Retry accepted
  /applications/{id}/manual-done:
    post:
      summary: Mark manual-needed application completed
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated status
  /applications/{id}/notes:
    put:
      summary: Update user notes
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Notes updated
  /profile:
    get:
      summary: Profile document
      responses:
        '200':
          description: Profile
    put:
      summary: Update profile/questionnaire/preferences partial
      responses:
        '200':
          description: Profile updated
  /profile/preferences:
    put:
      summary: Replace mutable preferences
      responses:
        '200':
          description: Preferences updated
  /profile/cv:
    post:
      summary: Upload and parse CV
      responses:
        '200':
          description: Parsed CV
    put:
      summary: Save edited CV JSON
      responses:
        '200':
          description: CV updated
  /profile/linkedin:
    post:
      summary: Upload LinkedIn connections CSV
      responses:
        '200':
          description: LinkedIn connections normalized
  /sheets/enable:
    post:
      summary: Begin Google Sheets OAuth flow
      responses:
        '200':
          description: Authorization URL
  /sheets/disable:
    post:
      summary: Disable sheets integration
      responses:
        '200':
          description: Disabled
  /sheets/sync:
    post:
      summary: Trigger full sheet sync
      responses:
        '200':
          description: Sync requested
  /sheets/status:
    get:
      summary: Sheets integration status
      responses:
        '200':
          description: Status payload
  /webhooks/agentmail:
    post:
      summary: AgentMail inbound webhook
      security: []
      responses:
        '200':
          description: Accepted / duplicate / ignored
        '401':
          description: Invalid signature
  /metrics:
    get:
      summary: Queue metrics (optional X-Metrics-Key)
      security: []
      parameters:
        - in: header
          name: X-Metrics-Key
          schema: { type: string }
      responses:
        '200':
          description: Metrics snapshot
