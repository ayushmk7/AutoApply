# Local API + worker + Redis + Playwright/texlive (see backend/server/Dockerfile).
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - autoapply-redis-data:/data

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["node", "dist/server.js"]
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["node", "dist/worker.js"]
    env_file:
      - ./server/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

volumes:
  autoapply-redis-data:
